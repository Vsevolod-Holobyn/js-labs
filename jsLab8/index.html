<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна — адаптивна сторінка</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button type="button" class="hamburger" id="hamburger">
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
    </button>
    <nav class="main-nav" id="main-nav">
      <ul class="main-nav__list">
        <li>
          <a href="#" class="main-nav__link">
            <span>Головна</span>
          </a>
        </li>
        <li>
          <a href="#" class="main-nav__link">
            <span>Про нас</span>
          </a>
        </li>
        <li>
          <a href="#" class="main-nav__link">
            <span>Послуги</span>
          </a>
        </li>
        <li>
          <a href="#" class="main-nav__link">
            <span>Контакти</span>
          </a>
        </li>
        <li>
          <a href="#" class="main-nav__link">
            <span>Обране</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="content">
    <section class="carousel-section">
      <div class="carousel" id="carousel">
        <div class="carousel__viewport">
          <div class="carousel__track" id="carousel-track">
            <figure class="carousel__slide">
              <img src="https://placehold.co/1200x500/1a365d/ffffff?text=Slide+1" alt="Слайд 1" width="1200" height="500" loading="eager">
            </figure>
            <figure class="carousel__slide">
              <img src="https://placehold.co/1200x500/2c5282/ffffff?text=Slide+2" alt="Слайд 2" width="1200" height="500" loading="lazy">
            </figure>
            <figure class="carousel__slide">
              <img src="https://placehold.co/1200x500/2b6cb0/ffffff?text=Slide+3" alt="Слайд 3" width="1200" height="500" loading="lazy">
            </figure>
            <figure class="carousel__slide">
              <img src="https://placehold.co/1200x500/3182ce/ffffff?text=Slide+4" alt="Слайд 4" width="1200" height="500" loading="lazy">
            </figure>
          </div>
        </div>
        <button type="button" class="carousel__arrow carousel__arrow--prev" id="carousel-prev">&#8249;</button>
        <button type="button" class="carousel__arrow carousel__arrow--next" id="carousel-next">&#8250;</button>
        <div class="carousel__dots" id="carousel-dots"></div>
      </div>
    </section>

    <section class="gallery gallery--large-only">
      <h2 class="gallery__title">Тільки Large</h2>
      <div class="gallery__grid">
        <img src="https://placehold.co/400x220/e2e8f0/1a202c?text=Large+A" alt="Зображення Large A" width="400" height="220" loading="lazy">
        <img src="https://placehold.co/400x220/cbd5e0/1a202c?text=Large+B" alt="Зображення Large B" width="400" height="220" loading="lazy">
        <img src="https://placehold.co/400x220/a0aec0/1a202c?text=Large+C" alt="Зображення Large C" width="400" height="220" loading="lazy">
      </div>
    </section>

    <section class="gallery gallery--medium-only">
      <h2 class="gallery__title">Тільки Medium</h2>
      <div class="gallery__grid">
        <img src="https://placehold.co/600x280/fed7d7/742a2a?text=Medium+1" alt="Зображення Medium 1" width="600" height="280" loading="lazy">
        <img src="https://placehold.co/600x280/feebc8/7b341e?text=Medium+2" alt="Зображення Medium 2" width="600" height="280" loading="lazy">
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
